<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script type="module">
import { GlyphFrame, TILE_LAYOUTS, screen as SCREEN, safe as SAFE } from "/src/glyph/index.ts";
import { screens } from "/src/apps/index.ts";

/**
 * With four containers fixed by hardware, tile *shape* is the only remaining
 * lever on transport cost. This measures, per screen and per layout, how many
 * bytes a second of animation actually costs.
 */
const report = {};

for (const [layoutName, layout] of Object.entries(TILE_LAYOUTS)) {
  const frame = new GlyphFrame({ tileLayout: layout, supersample: 2 });
  report[layoutName] = {};

  for (let s = 0; s < screens.length; s++) {
    const screen = screens[s];
    let dirty = 0;
    let bytes = 0;
    let previous = new Map();

    // Ten paints across one second of animation.
    for (let step = 0; step <= 10; step++) {
      frame.raster.clear(0);
      screen.render({
        g: frame.raster, now: 4000 + step * 100,
        screen: { x: 0, y: 0, ...SCREEN }, safe: SAFE,
        app: { screens, screenIndex: s }
      });
      const tiles = frame.toFrame().tiles;
      if (step > 0) {
        for (const tile of tiles) {
          if (previous.get(tile.id) !== tile.hash) { dirty++; bytes += tile.pixels.length; }
        }
      }
      previous = new Map(tiles.map((t) => [t.id, t.hash]));
    }
    report[layoutName][screen.name] = { dirty, kb: bytes / 1024 };
  }
}

window.__report = report;
window.__done = true;
</script></body></html>
