<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-label="Features: Framebuffer renderer: Paths, text, gradients and images reduced to 16 gray levels, split into tiles; only the tiles that changed are sent.; 123 components: HUD and navigation instruments, overlays, inputs, charts and 279 icons, all stateless functions.; Built for see-through: Outline-first surfaces, ink reports and a contrast lint keep screens light and readable on the lens.; Focus, not pointers: Screens, transitions and input routing designed around the four gestures the glasses report.; Tile-aware updates: Five full-screen tile layouts, a cost report and a recorder that suggests the layout for your app.; Browser-first workflow: Build and test in a browser without glasses; the optional runtime connects the same app to the G2."><title>Features: Framebuffer renderer: Paths, text, gradients and images reduced to 16 gray levels, split into tiles; only the tiles that changed are sent.; 123 components: HUD and navigation instruments, overlays, inputs, charts and 279 icons, all stateless functions.; Built for see-through: Outline-first surfaces, ink reports and a contrast lint keep screens light and readable on the lens.; Focus, not pointers: Screens, transitions and input routing designed around the four gestures the glasses report.; Tile-aware updates: Five full-screen tile layouts, a cost report and a recorder that suggests the layout for your app.; Browser-first workflow: Build and test in a browser without glasses; the optional runtime connects the same app to the G2.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#58a6ff;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#484f58;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
